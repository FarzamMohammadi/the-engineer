cost_limits:
  api:
    per_task:
      cost_usd: 5.0
    daily:
      cost_usd: 50.0
scope:
  repos:
    allowed:
      - "owner/my-app"
      - "owner/another-repo"
  branches:
    push_to:
      - "engineer/*"
      - "fix/*"
  files:
    exclude_patterns:
      - ".env*"
      - "secrets/**"
      - "*.pem"
      - "*.key"
      - "credentials.json"
autonomy:
  decisions:
    merge:
      level: always_ask
      description: "Merge decisions"
    deploy:
      level: threshold
      threshold: "low-risk"
      description: "Deployment decisions"
merge:
  auto_merge_after_approval:
    default: false
    repos:
      "owner/my-app": true
