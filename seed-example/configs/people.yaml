# People configuration
# Hot-reloadable — changes take effect without restart.
# Replace the placeholder values below with real people.

people:
  - id: owner
    name: Your Name
    roles: [owner]
    contacts:
      - channel: telegram
        handle: "your-telegram-handle"
      - channel: github
        handle: "your-github-username"
    preferences:
      notification_level: milestones
      quiet_hours: null
