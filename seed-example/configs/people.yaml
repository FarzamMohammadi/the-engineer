# People configuration
# Changes take effect on the next daemon restart.
# Replace the placeholder values below with real people.

people:
  - id: owner
    name: Your Name
    roles: [owner]
    contacts:
      - channel: telegram
        # For telegram, this is your exact Telegram username (case-insensitive, no leading @).
        # Send /start to the bot once before delivery works — the bot can't message you until you do.
        handle: "your_telegram_username"
      - channel: github
        handle: "your-github-username"
    preferences:
      notification_level: milestones
      quiet_hours: null
