# Safety configuration
# Changes take effect on the next daemon restart.

scope:
  branches:
    create_pattern: "engineer/.*"
    push_to: ["engineer/*"]
    merge_to: ["main"]
  files:
    exclude_patterns:
      - ".env*"
      - "secrets/**"
      - "*.pem"
      - "*.key"

autonomy:
  decisions:
    scope_expansion:
      level: always_decide      # blast radius / file count — don't ask
    refactoring_broad:
      level: always_ask         # refactoring beyond the task's files — always confirm

merge:
  auto_merge_after_approval:
    default: true
  enable_comment_approval: true          # Allow /approve PR comments as approval (solo-dev workflow)
  exclude_thoughts_on_merge: true        # Remove thoughts/ from branch before merge
